[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpa-builder"
version = "0.1.0"
description = "自然语言驱动的 AI-RPA 自动化脚本生成器：描述需求 → LLM 生成 RPA 脚本 → 打包为单文件 EXE"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rpa", "automation", "llm", "pyinstaller", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
rpa-builder = "rpa_builder.cli:main"
rpa-builder-gui = "rpa_builder.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpa_builder = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/W: pyflakes+pycodestyle；I: isort；B: bugbear；UP: pyupgrade；C4: flake8-comprehensions；SIM: simplify
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# rpa_tools.py 是打包给生成脚本使用的运行期 SDK：其防御式 try/except 与
# 持久文件流（stdout 兜底、日志流）是有意为之，豁免"简化"类规则。
"rpa_tools.py" = ["SIM105", "SIM115"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
python_files = "test_*.py"
